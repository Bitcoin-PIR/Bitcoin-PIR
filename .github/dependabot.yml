version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:10"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directories:
      - /web
      - /explorer
    schedule:
      interval: weekly
      day: tuesday
      time: "07:10"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        group-by: dependency-name
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # `web` depends on `pir-sdk-wasm` via a local `file:` path pointing at
      # `crates/sdk/wasm/pkg` (the wasm-pack build output), which is not
      # committed to the repository. Dependabot cannot fetch it, which fails
      # the whole npm_and_yarn update job with `path_dependencies_not_reachable`.
      # The package is a local build artifact with no registry version, so
      # there is nothing for Dependabot to update.
      - dependency-name: "pir-sdk-wasm"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "07:10"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
