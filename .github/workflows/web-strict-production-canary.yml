name: Web strict production canary

on:
  schedule:
    # Run after the native production canary's normal window so both do not
    # compete for the same PIR servers.
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-strict-production-canary
  cancel-in-progress: false

jobs:
  browser-canary:
    name: Four-backend strict browser query
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BPIR_PRODUCTION_CANARY: '1'
      BPIR_WEB_URL: 'https://www.bitcoinpir.org/'

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run strict production browser canary
        working-directory: web
        run: npm run test:e2e:strict-production

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-strict-production-canary-${{ github.run_id }}
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 14
