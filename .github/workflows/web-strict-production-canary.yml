name: Web strict production canary

on:
  # Live browser queries are intentionally opt-in.  Normal CI verifies the
  # semantic contract without opening a browser or contacting production.
  # Dispatch this after a deployment when a user asks for an end-to-end check.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-strict-production-canary
  cancel-in-progress: false

jobs:
  browser-canary:
    name: Four-backend strict browser query
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BPIR_PRODUCTION_CANARY: '1'
      BPIR_WEB_URL: 'https://www.bitcoinpir.org/'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.18.0'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium

      - name: Run strict production browser canary
        working-directory: web
        run: npm run test:e2e:strict-production

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-strict-production-canary-${{ github.run_id }}
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 14
