name: Web client build + tests

# PR-time gate for the web client and its WASM dependencies: builds the
# wasm crate for wasm32 (wasm-pack), typechecks web/src (`npm run build` =
# `tsc --noEmit`), runs the vitest suite, and builds the production bundle
# with its CSP check (`npm run build-web`).

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'vendor/**'
      - 'crates/protocol/**'
      - 'crates/sdk/core/**'
      - 'crates/sdk/wasm/**'
      - 'crates/sdk/client/**'
      - 'crates/trust/**'
      - 'web/**'
      - '.github/workflows/web-build.yml'
      - '.github/workflows/deploy-web.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'vendor/**'
      - 'crates/protocol/**'
      - 'crates/sdk/core/**'
      - 'crates/sdk/wasm/**'
      - 'crates/sdk/client/**'
      - 'crates/trust/**'
      - 'web/**'
      - '.github/workflows/web-build.yml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    name: wasm-pack + tsc + vitest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain (with wasm32 target)
        run: |
          rustup toolchain install --profile minimal
          rustup target add wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.18.0'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Cache Cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Keep a workflow-specific cache key so PR validation cannot reuse
          # incompatible artifacts from release or live-integration jobs.
          key: ${{ runner.os }}-cargo-web-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-web-build-

      - name: Install pinned WASM tools without executing a remote installer
        run: |
          cd "$RUNNER_TEMP"
          cargo +1.94.1 install wasm-pack \
            --version 0.14.0 \
            --locked \
            --root "$RUNNER_TEMP/wasm-pack"
          cargo +1.94.1 install wasm-bindgen-cli \
            --version 0.2.114 \
            --locked \
            --root "$RUNNER_TEMP/wasm-pack"
          echo "$RUNNER_TEMP/wasm-pack/bin" >> "$GITHUB_PATH"

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Build from the real workspace graph. Rewriting the root manifest to a
      # three-member synthetic workspace hid pir-sdk-wasm's actual path
      # dependencies (including pir-sdk-client, pir-channel, service policy,
      # directory, and payment adapters) and could silently drift from Cargo.
      - name: Build pir-sdk-wasm (wasm32 target validation)
        run: >-
          CARGO_NET_OFFLINE=true wasm-pack build crates/sdk/wasm
          --target web --out-dir pkg --mode no-install --no-opt
          -- --locked --offline

      # `npm run build` = `tsc --noEmit`: strict typecheck of every .ts
      # file under web/src/, including the test files.
      - name: TypeScript strict typecheck (npm run build)
        working-directory: web
        run: npm run build

      # `npm test` = `vitest run`.
      #
      # Excludes the live cross-language diff (`onion_leakage_diff.test.ts`)
      # — that test is gated on `RUN_LIVE_DIFF=1` because it requires
      # live FHE setup against a Hetzner OnionPIR server (~30s per
      # query × 2 queries). Run it manually before releases.
      - name: Run vitest unit tests
        working-directory: web
        run: npm test

      - name: Build production web bundle
        working-directory: web
        run: npm run build-web
