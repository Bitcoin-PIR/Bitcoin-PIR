name: Web client build + tests

# Release-readiness gate for the web client and its WASM dependencies.
#
# `pir-sdk-integration.yml` already validates the Rust-native code path
# against the live Hetzner deployment, and `deploy-web.yml` builds the
# web bundle on push-to-main for GitHub Pages. Neither covers:
#
#   1. **wasm32 target compilation on PRs.** Today wasm-pack only runs
#      via `deploy-web.yml` on push-to-main; a PR that breaks the
#      wasm32 build (e.g., refactor that pulls a native-only API into
#      shared code) merges silently and surfaces only at deploy time.
#
#   2. **TypeScript strict typecheck (`tsc`).** `web/package.json` has
#      `build` = `tsc` and `build-web` = `vite build`. The deploy
#      workflow runs `build-web` (esbuild bundler — permissive). `tsc`
#      strict-mode errors (null-vs-undefined narrows, hand-written
#      interface drift between `sdk-bridge.ts` and WASM-generated
#      stubs, etc.) are never gated.
#
#   3. **vitest unit tests.** `web/src/__tests__/` includes pure-helper
#      TS-side analogs of the Kani harnesses plus the Payment V1 admission,
#      recovery, and provider-selection tests. This suite is never inferred
#      from a stale hard-coded test count.
#
# This workflow plugs all three gaps with a single PR-time job. The
# wasm-pack output is reused by the tsc step (the regenerated
# `crates/sdk/wasm/pkg/*.d.ts` stubs are what `web/src/sdk-bridge.ts`
# imports), so any drift between the Rust-side `#[wasm_bindgen]` API
# and the hand-written TS interface fires at this point.

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/protocol/**'
      - 'crates/payment/crypto/**'
      - 'crates/payment/arc-adapter/**'
      - 'crates/directory/nostr/**'
      - 'crates/sdk/core/**'
      - 'crates/sdk/wasm/**'
      - 'crates/sdk/client/**'
      - 'web/**'
      - 'verification/locks/generated-proofs.json'
      - '.github/workflows/web-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/protocol/**'
      - 'crates/payment/crypto/**'
      - 'crates/payment/arc-adapter/**'
      - 'crates/directory/nostr/**'
      - 'crates/sdk/core/**'
      - 'crates/sdk/wasm/**'
      - 'crates/sdk/client/**'
      - 'web/**'
      - 'verification/locks/generated-proofs.json'
      - '.github/workflows/web-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    name: wasm-pack + tsc + vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pinned Rust toolchain (with wasm32 target)
        run: rustup toolchain install --profile minimal --target wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Cache Cargo registry + target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Keep a workflow-specific cache key so PR validation cannot reuse
          # incompatible artifacts from release or live-integration jobs.
          key: ${{ runner.os }}-cargo-web-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-web-build-

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Build from the real workspace graph. Rewriting the root manifest to a
      # three-member synthetic workspace hid pir-sdk-wasm's actual path
      # dependencies (including pir-sdk-client, pir-channel, service policy,
      # directory, and payment adapters) and could silently drift from Cargo.
      - name: Build pir-sdk-wasm (wasm32 target validation)
        run: wasm-pack build crates/sdk/wasm --target web --out-dir pkg

      # `npm run build` = `tsc`. Strict typecheck of every .ts file
      # under web/src/, including the test files. Catches drift in
      # `sdk-bridge.ts` interfaces against the regenerated
      # `crates/sdk/wasm/pkg/*.d.ts` stubs.
      - name: TypeScript strict typecheck (npm run build = tsc)
        working-directory: web
        run: npm run build

      # `npm test` = `vitest run`, including chunk_max/index_max closure
      # helpers and Payment V1 admission/recovery tests.
      #
      # Excludes the live cross-language diff (`onion_leakage_diff.test.ts`)
      # — that test is gated on `RUN_LIVE_DIFF=1` because it requires
      # live FHE setup against a Hetzner OnionPIR server (~30s per
      # query × 2 queries). Run it manually before releases.
      - name: Run vitest unit tests
        working-directory: web
        run: npm test

      - name: Build production web bundle
        working-directory: web
        run: npm run build-web

      # Parse and discover the browser canary without issuing live production
      # queries on every PR. The scheduled workflow owns those queries.
      - name: Discover strict production Playwright canary
        working-directory: web
        run: npm run test:e2e:strict-production -- --list
