      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'vendor/**'
      - 'apps/payment-issuer/**'
      - 'apps/cln-rpc-guard/**'
      - 'apps/rollback-authority/**'
      - 'apps/directory-relay/**'
      - 'apps/admin/**'
      - 'apps/server/**'
      - 'crates/net/**'
      - 'crates/protocol/channel/**'
      - 'crates/protocol/core/**'
      - 'crates/directory/nostr/**'
      - 'crates/payment/**'
      - 'crates/protocol/runtime/**'
      - 'crates/protocol/service/**'
      - 'crates/protocol/service-store/**'
      - 'crates/sdk/core/**'
      - 'crates/sdk/client/**'
      - 'crates/sdk/wasm/**'
      - 'crates/security/**'
      - 'crates/trust/**'
      - 'docs/payment/**'
      - 'deploy/payment-v1/**'
      - 'scripts/fixtures/**'
      - 'scripts/payment-v1-deployment-template-gate.mjs'
      - 'scripts/payment-v1-deployment-template-gate.test.mjs'
      - 'scripts/build-payment-v1-directory-relay.sh'
      - 'scripts/payment-v1-directory-relay-artifact-gate.mjs'
      - 'scripts/payment-v1-directory-relay-artifact-gate.test.mjs'
      - 'scripts/payment-v1-renameat2-noreplace.rs'
      - 'scripts/payment-v1-rendered-artifact-gate.mjs'
      - 'scripts/payment-v1-rendered-artifact-gate.test.mjs'
      - 'scripts/payment-v1-linux-runtime-evidence.mjs'
      - 'scripts/payment-v1-linux-runtime-evidence.test.mjs'
      - 'scripts/payment-v1-integrated-caddy-*'
      - 'scripts/payment-v1-caddy-admin-uds-*'
      - 'scripts/payment-v1-core-pattern-*'
      - 'scripts/payment-v1-source-fair-edge.test.mjs'
      - 'scripts/payment-v1-local-check.sh'
      - 'scripts/payment-v1-cdk-regtest-e2e.sh'
      - 'scripts/payment-v1-cln-regtest-e2e.sh'
      - 'scripts/payment-v1-nostr-readback.mjs'
      - 'scripts/payment-v1-nostr-readback.test.mjs'
      - 'scripts/payment-v1-pages-deploy-gate.mjs'
      - 'scripts/payment-v1-publisher-netns-*'
      - 'web/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'vendor/**'
      - 'apps/payment-issuer/**'
      - 'apps/cln-rpc-guard/**'
      - 'apps/rollback-authority/**'
      - 'apps/directory-relay/**'
      - 'apps/admin/**'
      - 'apps/server/**'
      - 'crates/net/**'
      - 'crates/protocol/channel/**'
      - 'crates/protocol/core/**'
      - 'crates/directory/nostr/**'
      - 'crates/payment/**'
      - 'crates/protocol/runtime/**'
      - 'crates/protocol/service/**'
      - 'crates/protocol/service-store/**'
      - 'crates/sdk/core/**'
      - 'crates/sdk/client/**'
      - 'crates/sdk/wasm/**'
      - 'crates/security/**'
      - 'crates/trust/**'
      - 'docs/payment/**'
      - 'deploy/payment-v1/**'
      - 'scripts/fixtures/**'
      - 'scripts/payment-v1-deployment-template-gate.mjs'
      - 'scripts/payment-v1-deployment-template-gate.test.mjs'
      - 'scripts/build-payment-v1-directory-relay.sh'
      - 'scripts/payment-v1-directory-relay-artifact-gate.mjs'
      - 'scripts/payment-v1-directory-relay-artifact-gate.test.mjs'
      - 'scripts/payment-v1-renameat2-noreplace.rs'
      - 'scripts/payment-v1-rendered-artifact-gate.mjs'
      - 'scripts/payment-v1-rendered-artifact-gate.test.mjs'
      - 'scripts/payment-v1-linux-runtime-evidence.mjs'
      - 'scripts/payment-v1-linux-runtime-evidence.test.mjs'
      - 'scripts/payment-v1-integrated-caddy-*'
      - 'scripts/payment-v1-caddy-admin-uds-*'
      - 'scripts/payment-v1-core-pattern-*'
      - 'scripts/payment-v1-source-fair-edge.test.mjs'
      - 'scripts/payment-v1-local-check.sh'
      - 'scripts/payment-v1-cdk-regtest-e2e.sh'
      - 'scripts/payment-v1-cln-regtest-e2e.sh'
      - 'scripts/payment-v1-nostr-readback.mjs'
      - 'scripts/payment-v1-nostr-readback.test.mjs'
      - 'scripts/payment-v1-pages-deploy-gate.mjs'
      - 'scripts/payment-v1-publisher-netns-*'
      - 'web/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-and-persistence:
    name: Protocol, stores, adapters, issuer and runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - name: Test payment platform offline
        run: >-
          cargo test --locked --offline
          -p pir-channel
          -p pir-strict-https
          -p pir-private-files
          -p pir-rollback-authority-protocol
          -p pir-rollback-authority-client
          -p pir-rollback-authority-store
          -p pir-service-protocol
          -p pir-service-store
          -p pir-payment-crypto
          -p pir-lightning-backend
          -p pir-issuer-store
          -p pir-issuer-core
          -p pir-issuer-credentials
          -p pir-issuer-clearing
          -p pir-issuer-service
          -p pir-provider-clearing-client
          -p pir-cashu-client
          -p pir-cashu-custody
          -p pir-arc-adapter
          -p pir-directory-nostr
          -p bitcoinpir-directory-relay
          -p bitcoinpir-cln-rpc-guard
          -p pir-runtime-core
          -p pir-sdk-client
          -p pir-sdk-wasm
          -p payment-issuer
          -p rollback-authority
          -p bpir-admin
      - name: Enforce the real Linux root UID/GID credential boundary
        run: |
          rustup_home="$(rustup show home)"
          cargo_home="${CARGO_HOME:-${HOME}/.cargo}"
          cargo_bin="$(command -v cargo)"
          root_test_target="$(mktemp -d "${RUNNER_TEMP}/bpir-admin-root-target.XXXXXX")"
          trap 'sudo rm -rf -- "$root_test_target"' EXIT
          sudo env \
            PATH="$PATH" \
            RUSTUP_HOME="$rustup_home" \
            CARGO_HOME="$cargo_home" \
            CARGO_TARGET_DIR="$root_test_target" \
            BPIR_REQUIRE_ROOT_CREDENTIAL_TEST=1 \
            "$cargo_bin" test --locked --offline -p bpir-admin \
              lightning_staging::tests::protected_config_real_linux_uid_gid_and_mode_contract \
              -- --exact --nocapture
      - name: Test concrete provider-store Cashu BAT verifier boundary
        run: >-
          cargo test --locked --offline
          -p pir-payment-crypto
          --features provider-store
          --test provider_store_bat_adapter
      - name: Test concrete provider-store experimental ARC boundary
        run: >-
          cargo test --locked --offline
          -p pir-arc-adapter
          --features provider-store
      - name: Deny warnings across dedicated Payment V1 crates and issuer
        run: >-
          cargo clippy --locked --offline --all-targets --no-deps
          -p pir-strict-https
          -p pir-private-files
          -p pir-rollback-authority-protocol
          -p pir-rollback-authority-client
          -p pir-rollback-authority-store
          -p pir-service-protocol
          -p pir-service-store
          -p pir-payment-crypto
          -p pir-lightning-backend
          -p pir-issuer-store
          -p pir-issuer-core
          -p pir-issuer-credentials
          -p pir-issuer-clearing
          -p pir-issuer-service
          -p pir-provider-clearing-client
          -p pir-cashu-client
          -p pir-cashu-custody
          -p pir-arc-adapter
          -p pir-directory-nostr
          -p bitcoinpir-directory-relay
          -p bitcoinpir-cln-rpc-guard
          -p payment-issuer
          -p rollback-authority
          -p bpir-admin
          -- -D warnings
      - name: Exercise the debug-only fake-Lightning issuer boundary
        run: |
          cargo test --locked --offline -p payment-issuer --features test-only-fake-lightning
          cargo run --locked --offline -p payment-issuer --features test-only-fake-lightning -- serve-fake --help >/dev/null
          cargo clippy --locked --offline -p payment-issuer --features test-only-fake-lightning --all-targets --no-deps -- -D warnings
      - name: Exercise bounded Payment V1 adversarial corpus
        run: |
          cargo test --locked --offline -p pir-service-protocol --test payment_v1_adversarial
          cargo test --locked --offline -p pir-runtime-core --test service_admission_adversarial
          cargo test --locked --offline -p pir-strict-https
          cargo test --locked --offline -p pir-rollback-authority-protocol
          cargo test --locked --offline -p pir-rollback-authority-client
          cargo test --locked --offline -p pir-rollback-authority-store
          cargo test --locked --offline -p rollback-authority
      - name: Test and lint unified server admission wiring
        run: |
          cargo check --locked --offline -p runtime --bin unified_server
          cargo test --locked --offline -p runtime --lib hint_pool
          cargo test --locked --offline -p runtime --bin unified_server
          cargo test --locked --offline -p runtime \
            --features test-only-unsafe-query-logging \
            --bin unified_server \
            service_admission_dispatch_tests::explicit_debug_feature_cli_parser_recognizes_unsafe_logging_flag \
            -- --exact
          cargo clippy --locked --offline -p runtime \
            --bin unified_server \
            --test payment_v1_process_e2e \
            --test payment_v1_methods_process_e2e \
            --test payment_v1_harmony_pool_process_e2e \
            --test payment_v1_onion_process_e2e \
            --no-deps \
            -- -D warnings
          cargo clippy --locked --offline -p runtime \
            --features test-only-unsafe-query-logging \
            --bin unified_server \
            --no-deps \
            -- -D warnings
      - name: Exercise loopback two-provider process admission
        run: |
          cargo test --locked --offline -p runtime --test payment_v1_process_e2e
          cargo test --locked --offline -p runtime --test payment_v1_methods_process_e2e
          cargo test --locked --offline -p runtime --test payment_v1_harmony_pool_process_e2e
          cargo test --locked --offline -p runtime --test payment_v1_onion_process_e2e
      - name: Exercise paid admission through the real authenticated TEE-ORAM handler
        run: |
          cargo test --locked --offline --manifest-path vendor/bitcoinpir-oram/Cargo.toml
          cargo test --locked --offline -p runtime --features cuckoo-oram --test payment_v1_tee_oram_process_e2e
          cargo clippy --locked --offline -p runtime --features cuckoo-oram --bin unified_server --test payment_v1_tee_oram_process_e2e --no-deps -- -D warnings
      - name: Exercise two independent directory-relay process stores and views
        run: |
          cargo test --locked --offline -p bitcoinpir-directory-relay --test payment_v1_two_relay_process_e2e two_relay_real_process_catalog_e2e -- --exact --ignored
          cargo clippy --locked --offline -p bitcoinpir-directory-relay --test payment_v1_two_relay_process_e2e --no-deps -- -D warnings
      - name: Exercise provider and issuer remote rollback authorities over pinned WebPKI TLS
        run: |
          cargo test --locked --offline -p pir-rollback-authority-client --features test-only-webpki-root test_only_webpki_root_requires_owner_only_regular_file
          cargo test --locked --offline -p runtime --features remote-authority-process-e2e --test payment_v1_process_e2e remote_authority_process::remote_authority_real_process_tls_provider_e2e -- --exact
          cargo test --locked --offline -p runtime --features remote-authority-process-e2e --test payment_v1_process_e2e three_authority_process::three_authority_real_process_topology_e2e -- --exact
          cargo clippy --locked --offline -p runtime --features remote-authority-process-e2e --bin unified_server --test payment_v1_process_e2e --no-deps -- -D warnings
          cargo test --locked --offline -p payment-issuer --features remote-authority-process-e2e --test remote_authority_process_e2e payment_issuer_remote_authority_real_process_tls_e2e -- --exact
          cargo clippy --locked --offline -p payment-issuer --features remote-authority-process-e2e --all-targets --no-deps -- -D warnings
      - name: Exercise Standard Cashu TLS providers and the complete non-receipt backend matrix
        run: |
          cargo test --locked --offline -p runtime --features standard-cashu-process-e2e --test payment_v1_standard_cashu_process_e2e standard_cashu_real_process_tls_two_provider_e2e -- --exact
          cargo test --locked --offline -p runtime --features standard-cashu-process-e2e --test payment_v1_process_e2e all_non_receipt_methods_commit_before_real_harmony_query_and_replay_after_restart -- --exact
          cargo test --locked --offline -p runtime --features standard-cashu-process-e2e --test payment_v1_harmony_pool_process_e2e all_non_receipt_methods_restore_pre_dispatch_and_burn_on_real_hint_dispatch -- --exact
          cargo test --locked --offline -p runtime --features standard-cashu-process-e2e --test payment_v1_onion_process_e2e all_non_receipt_methods_commit_before_real_onion_job_and_replay_after_restart -- --exact
          cargo test --locked --offline -p runtime --features cuckoo-oram,standard-cashu-process-e2e --test payment_v1_tee_oram_process_e2e all_non_receipt_methods_commit_before_real_tee_oram_and_replay_after_restart -- --exact
          cargo clippy --locked --offline -p runtime --features standard-cashu-process-e2e --bin unified_server --test payment_v1_standard_cashu_process_e2e --test payment_v1_process_e2e --test payment_v1_harmony_pool_process_e2e --test payment_v1_onion_process_e2e --no-deps -- -D warnings
          cargo clippy --locked --offline -p runtime --features cuckoo-oram,standard-cashu-process-e2e --bin unified_server --test payment_v1_tee_oram_process_e2e --no-deps -- -D warnings
          log_file="$(mktemp "${RUNNER_TEMP}/bpir-cashu-test-root-cli.XXXXXX")"
          trap 'rm -f -- "$log_file"' EXIT
          if cargo run --locked --offline -p runtime --bin unified_server -- --test-only-service-https-root-pem /does/not/exist >"$log_file" 2>&1; then
            echo "normal unified_server unexpectedly accepted the test-only HTTPS root flag" >&2
            exit 1
          fi
          grep -F 'unknown argument: --test-only-service-https-root-pem' "$log_file" >/dev/null
      - name: Exercise real provider to shared issuer clearing over pinned WebPKI TLS
        run: |
          issuer_e2e_target_dir="$PWD/target/payment-issuer-shared-e2e"
          cargo build --locked --offline \
            -p payment-issuer \
            --features test-only-fake-lightning \
            --bin payment-issuer \
            --target-dir "$issuer_e2e_target_dir"
          cargo build --locked --offline \
            -p bpir-admin \
            --bin bpir-admin \
            --target-dir "$issuer_e2e_target_dir"
          BITCOINPIR_PAYMENT_ISSUER_BIN="$issuer_e2e_target_dir/debug/payment-issuer" \
          BITCOINPIR_BPIR_ADMIN_BIN="$issuer_e2e_target_dir/debug/bpir-admin" \
            cargo test --locked --offline \
              -p runtime \
              --features shared-issuer-process-e2e \
              --test payment_v1_shared_issuer_process_e2e \
              shared_issuer_real_process_tls_e2e -- --exact
          cargo clippy --locked --offline \
            -p runtime \
            --features shared-issuer-process-e2e \
            --bin unified_server \
            --test payment_v1_shared_issuer_process_e2e \
            --no-deps -- -D warnings
      - name: Prove test-only WebPKI roots cannot enter release artifacts
        run: |
          log_file="$(mktemp "${RUNNER_TEMP}/bpir-test-root-release.XXXXXX")"
          trap 'rm -f -- "$log_file"' EXIT
          if cargo check --locked --offline --release -p pir-strict-https --features test-only-webpki-root >"$log_file" 2>&1; then
            echo "test-only WebPKI root feature unexpectedly compiled in release mode" >&2
            exit 1
          fi
          grep -F 'test-only-webpki-root must never be compiled into a production release' "$log_file" >/dev/null
          if RUSTFLAGS='-C debug-assertions=yes' cargo check --locked --offline --release -p pir-strict-https --features test-only-webpki-root >"$log_file" 2>&1; then
            echo "test-only WebPKI root feature unexpectedly compiled in assertions-enabled release mode" >&2
            exit 1
          fi
          grep -F 'test-only-webpki-root must never be compiled into a production release' "$log_file" >/dev/null
          if cargo check --locked --offline --release -p payment-issuer --features remote-authority-process-e2e >"$log_file" 2>&1; then
            echo "payment-issuer test-only remote-authority feature unexpectedly compiled in release mode" >&2
            exit 1
          fi
          grep -F 'test-only-webpki-root must never be compiled into a production release' "$log_file" >/dev/null
          if cargo check --locked --offline --release -p runtime --features remote-authority-process-e2e >"$log_file" 2>&1; then
            echo "runtime test-only remote-authority feature unexpectedly compiled in release mode" >&2
            exit 1
          fi
          grep -F 'test-only-webpki-root must never be compiled into a production release' "$log_file" >/dev/null
          if cargo check --locked --offline --release -p runtime --features standard-cashu-process-e2e >"$log_file" 2>&1; then
            echo "runtime Standard Cashu test-only WebPKI feature unexpectedly compiled in release mode" >&2
            exit 1
          fi
          grep -F 'test-only-webpki-root must never be compiled into a production release' "$log_file" >/dev/null
          if cargo check --locked --offline --release -p runtime --features shared-issuer-process-e2e >"$log_file" 2>&1; then
            echo "runtime shared-issuer test-only WebPKI feature unexpectedly compiled in release mode" >&2
            exit 1
          fi
          grep -F 'test-only-webpki-root must never be compiled into a production release' "$log_file" >/dev/null
      - name: Prove fake Lightning cannot enter or activate in release artifacts
        run: |
          log_file="$(mktemp "${RUNNER_TEMP}/bpir-fake-lightning-release.XXXXXX")"
          trap 'rm -f -- "$log_file"' EXIT
          if cargo run --locked --offline --release -p payment-issuer -- serve-fake --help >"$log_file" 2>&1; then
            echo "default release payment-issuer unexpectedly accepted serve-fake" >&2
            exit 1
          fi
          grep -F "unrecognized subcommand 'serve-fake'" "$log_file" >/dev/null
          if cargo check --locked --offline --release -p payment-issuer --features test-only-fake-lightning >"$log_file" 2>&1; then
            echo "test-only fake Lightning unexpectedly compiled in release mode" >&2
            exit 1
          fi
          grep -F 'test-only-fake-lightning must never be compiled into a production release' "$log_file" >/dev/null
          if RUSTFLAGS='-C debug-assertions=yes' cargo check --locked --offline --release -p payment-issuer --features test-only-fake-lightning >"$log_file" 2>&1; then
            echo "test-only fake Lightning unexpectedly compiled in assertions-enabled release mode" >&2
            exit 1
          fi
          grep -F 'test-only-fake-lightning must never be compiled into a production release' "$log_file" >/dev/null
      - name: Prove query-correlation logging cannot enter release artifacts
        run: |
          log_file="$(mktemp "${RUNNER_TEMP}/bpir-unsafe-query-log-release.XXXXXX")"
          trap 'rm -f -- "$log_file"' EXIT
          if cargo check --locked --offline --release -p runtime --features test-only-unsafe-query-logging >"$log_file" 2>&1; then
            echo "test-only query logging unexpectedly compiled in release mode" >&2
            exit 1
          fi
          # shellcheck disable=SC2016 # Backticks are expected literally in the compiler diagnostic.
          grep -F 'feature `test-only-unsafe-query-logging` is restricted to Cargo' "$log_file" >/dev/null
          if RUSTFLAGS='-C debug-assertions=yes' cargo check --locked --offline --release -p runtime --features test-only-unsafe-query-logging >"$log_file" 2>&1; then
            echo "test-only query logging unexpectedly compiled in assertions-enabled release mode" >&2
            exit 1
          fi
          # shellcheck disable=SC2016 # Backticks are expected literally in the compiler diagnostic.
          grep -F 'feature `test-only-unsafe-query-logging` is restricted to Cargo' "$log_file" >/dev/null
      - name: Compile opt-in real-CDK provider interoperability test
        run: >-
          cargo test --locked --offline
          -p pir-cashu-client
          --features insecure-dev-sqlite-store
          --test cdk_nut03_interop
          --no-run
      - name: Exercise deterministic no-funds operator fixture
        run: |
          fixture_root="$(mktemp -d "${RUNNER_TEMP}/bpir-payment-v1-fixture.XXXXXX")"
          trap 'rm -rf -- "$fixture_root"' EXIT
          scripts/fixtures/generate-payment-v1-no-funds.sh "$fixture_root/generated"
          test -s "$fixture_root/generated/fixture.json"
      - name: Validate opt-in external interoperability runners
        run: |
          bash -n scripts/payment-v1-cdk-regtest-e2e.sh
          grep -F 'standard_cashu_real_cdk_browser_provider_two_server_e2e' scripts/payment-v1-cdk-regtest-e2e.sh >/dev/null
          grep -F 'standard_cashu_cdk_tls_proxy_subprocess' apps/server/tests/payment_v1_standard_cashu_process_e2e.rs >/dev/null
          # shellcheck disable=SC2016 # The arithmetic expression is an asserted literal in the target script.
          grep -F 'total_mint_amount=$((expected_amount * 2))' scripts/payment-v1-cdk-regtest-e2e.sh >/dev/null
          bash -n scripts/payment-v1-cln-regtest-e2e.sh
          bash scripts/payment-v1-cln-regtest-e2e.sh --help | grep -F -- '--acknowledge-local-regtest-only' >/dev/null
          test -s web/e2e/payment-two-provider-cln-joined.spec.ts
          test -s web/playwright.payment-cln-joined.config.ts
          grep -F 'playwright.payment-cln-joined.config.ts' web/package.json >/dev/null
          grep -F "BITCOINPIR_PAYMENT_TWO_PROVIDER_BACKEND = 'fake'" web/playwright.payment-two-provider.config.ts >/dev/null
          grep -F "BITCOINPIR_PAYMENT_TWO_PROVIDER_BACKEND = 'cln-regtest'" web/playwright.payment-cln-joined.config.ts >/dev/null

  wasm-boundary:
    name: Browser payment and directory boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain with wasm32
        run: |
          rustup toolchain install --profile minimal
          rustup target add wasm32-unknown-unknown
      - name: Check WASM without native provider storage
        run: cargo check --locked --offline --target wasm32-unknown-unknown -p pir-sdk-wasm

  directory-relay-artifact:
    name: Reproduce directory-relay selection artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.18.0'
      - name: Pull the exact reviewed build image
        run: >-
          docker pull
          docker.io/library/rust@sha256:4ec71e955e6c08aeb238885083222ddff79d82eb87654a96c76e38e94da1a53b
      - name: Build, atomically publish, and fully reverify the preparation artifact
        run: |
          mapfile -t bpir_relay_selection < <(
            node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { validateRelaySelection } from "./scripts/payment-v1-deployment-template-gate.mjs";
          const selection = validateRelaySelection(
            readFileSync("deploy/payment-v1/relay-selection.toml.example", "utf8"),
          );
          console.log(selection.status);
          console.log(selection.status === "RESOLVED" ? selection.sourceCommit : "");
          NODE
          )
          bpir_selection_status="${bpir_relay_selection[0]}"
          if [[ "$bpir_selection_status" == "RESOLVED" ]]; then
            bpir_source_commit="${bpir_relay_selection[1]}"
          elif [[ "$bpir_selection_status" == "UNRESOLVED" ]]; then
            bpir_source_commit="$(git rev-parse HEAD)"
          else
            echo 'directory relay selection parser returned an impossible status' >&2
            exit 1
          fi
          test "$(git rev-parse --verify "$bpir_source_commit^{commit}")" = "$bpir_source_commit"
          bpir_artifact_parent="$(mktemp -d "${RUNNER_TEMP}/bpir-directory-relay-build.XXXXXX")"
          bash scripts/build-payment-v1-directory-relay.sh \
            --repository "$GITHUB_WORKSPACE" \
            --source-commit "$bpir_source_commit" \
            --output "$bpir_artifact_parent/artifact"
          test -f "$bpir_artifact_parent/artifact/build-manifest.json"
          test -x "$bpir_artifact_parent/artifact/bitcoinpir-directory-relay"
          if [[ "$bpir_selection_status" == "RESOLVED" ]]; then
            node scripts/payment-v1-directory-relay-artifact-gate.mjs verify-selection \
              --repository "$GITHUB_WORKSPACE" \
              --artifacts "$bpir_artifact_parent/artifact" \
              --source-commit "$bpir_source_commit" \
              --docker "$(command -v docker)" \
              --selection "$GITHUB_WORKSPACE/deploy/payment-v1/relay-selection.toml.example" \
              --config "$GITHUB_WORKSPACE/deploy/payment-v1/directory-relay.toml.example"
          fi

  browser-storage-boundary:
    name: Chromium vault and real no-funds issuer boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain with wasm32
        run: |
          rustup toolchain install --profile minimal
          rustup target add wasm32-unknown-unknown
      - name: Install pinned WASM tools without executing a remote installer
        run: |
          cd "$RUNNER_TEMP"
          cargo +1.94.1 install wasm-pack \
            --version 0.14.0 \
            --locked \
            --root "$RUNNER_TEMP/wasm-pack"
          cargo +1.94.1 install wasm-bindgen-cli \
            --version 0.2.114 \
            --locked \
            --root "$RUNNER_TEMP/wasm-pack"
          echo "$RUNNER_TEMP/wasm-pack/bin" >> "$GITHUB_PATH"
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.18.0'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install pinned web dependencies
        working-directory: web
        run: npm ci
      - name: Enforce manual main-only production Pages deployment
        run: node scripts/payment-v1-pages-deploy-gate.mjs
      - name: Install source-fair edge compatibility test binaries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends haproxy
          /usr/sbin/haproxy -vv | grep -E '^HAProxy version 2\.8\.'
          /usr/sbin/haproxy -vv | grep -E '(\+SYSTEMD)([[:space:]]|$)'
          caddy_container="$(docker create caddy@sha256:844f60b64e4724a5aa8245e019dace0d3f199f7433ce6c57676cb30a920dbad9)"
          docker cp "$caddy_container:/usr/bin/caddy" "$RUNNER_TEMP/caddy"
          docker rm "$caddy_container"
          chmod 0555 "$RUNNER_TEMP/caddy"
          test "$("$RUNNER_TEMP/caddy" version | awk '{print $1}')" = 'v2.11.4'
          test "$(sha256sum "$RUNNER_TEMP/caddy" | awk '{print $1}')" = 'b7105518e3ed1c0761f232e44fc09345535533c9cb0abf0e12809416c7ac64d9'
          sudo install -o root -g root -m 0555 "$RUNNER_TEMP/caddy" /usr/local/bin/caddy
          echo 'BPIR_HAPROXY_BIN=/usr/sbin/haproxy' >> "$GITHUB_ENV"
          echo "BPIR_CADDY_BIN=$RUNNER_TEMP/caddy" >> "$GITHUB_ENV"
      - name: Validate non-activating Payment V1 deployment templates
        run: |
          if git grep -nE '(^|[^0-9A-Za-z])629[0-9]{2}([^0-9A-Za-z]|$)' -- deploy/payment-v1 docs/payment 'scripts/payment-v1-*'; then
            echo 'former Payment V1 629xx service identities are forbidden'
            exit 1
          fi
          node --check scripts/payment-v1-deployment-template-gate.mjs
          node --test scripts/payment-v1-deployment-template-gate.test.mjs
          node scripts/payment-v1-deployment-template-gate.mjs
          bash -n scripts/build-payment-v1-directory-relay.sh
          bash scripts/build-payment-v1-directory-relay.sh --help >/dev/null
          node --check scripts/payment-v1-directory-relay-artifact-gate.mjs
          node --check scripts/payment-v1-directory-relay-artifact-gate.test.mjs
          node --test scripts/payment-v1-directory-relay-artifact-gate.test.mjs
          node --check scripts/payment-v1-rendered-artifact-gate.mjs
          node --check scripts/payment-v1-rendered-artifact-gate.test.mjs
          node --check scripts/payment-v1-linux-runtime-evidence.mjs
          node --check scripts/payment-v1-linux-runtime-evidence.test.mjs
          node --check scripts/payment-v1-integrated-caddy-overlay-gate.mjs
          node --check scripts/payment-v1-integrated-caddy-overlay-gate.test.mjs
          node --check scripts/payment-v1-integrated-caddy-overlay-transaction.mjs
          node --check scripts/payment-v1-integrated-caddy-overlay-transaction.test.mjs
          node --check scripts/payment-v1-integrated-caddy-rename-exchange.test.mjs
          node --check scripts/payment-v1-caddy-admin-uds-gate.mjs
          node --check scripts/payment-v1-caddy-admin-uds-gate.test.mjs
          node --check scripts/payment-v1-caddy-admin-uds-probe.mjs
          node --check scripts/payment-v1-caddy-admin-uds-transaction.mjs
          node --check scripts/payment-v1-caddy-admin-uds-transaction.test.mjs
          node --check scripts/payment-v1-caddy-admin-uds-transaction.fs.test.mjs
          node --check scripts/payment-v1-caddy-admin-uds-real-adapter.test.mjs
          node scripts/payment-v1-caddy-admin-uds-gate.mjs --help >/dev/null
          node --check scripts/payment-v1-core-pattern-ceremony.mjs
          node --check scripts/payment-v1-core-pattern-test-fixture.mjs
          node --check scripts/payment-v1-core-pattern-crash-worker.mjs
          node --check scripts/payment-v1-core-pattern-ceremony.test.mjs
          node --check scripts/payment-v1-core-pattern-crash.test.mjs
          node --check scripts/payment-v1-core-pattern-lock-exec.test.mjs
          node --test scripts/payment-v1-core-pattern-ceremony.test.mjs \
            scripts/payment-v1-core-pattern-crash.test.mjs \
            scripts/payment-v1-core-pattern-lock-exec.test.mjs
          sh -n scripts/payment-v1-core-pattern-independent-kernel-gate.sh
          node --test scripts/payment-v1-core-pattern-independent-kernel-gate.test.mjs
          node --check scripts/payment-v1-source-fair-edge.test.mjs
          node --test --test-concurrency=1 \
            scripts/payment-v1-integrated-caddy-overlay-gate.test.mjs \
            scripts/payment-v1-integrated-caddy-overlay-transaction.test.mjs \
            scripts/payment-v1-source-fair-edge.test.mjs
          # These suites exercise competing global /tmp and systemd-shaped
          # paths. Keep them in independent serial Node invocations.
          node --test --test-concurrency=1 \
            scripts/payment-v1-rendered-artifact-gate.test.mjs
          node --test --test-concurrency=1 \
            scripts/payment-v1-linux-runtime-evidence.test.mjs
          node --test scripts/payment-v1-caddy-admin-uds-gate.test.mjs
          node --test scripts/payment-v1-caddy-admin-uds-transaction.test.mjs
          node --test scripts/payment-v1-caddy-admin-uds-transaction.fs.test.mjs
          systemd-analyze verify scripts/fixtures/payment-v1-caddy-admin-uds-hardened.service
          sudo "$(command -v node)" --test \
            scripts/payment-v1-integrated-caddy-lock.test.mjs \
            scripts/payment-v1-integrated-caddy-rename-exchange.test.mjs
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=64m \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            --workdir /work \
            node@sha256:9f6d5975c7dca860947d3915877f85607946403fc55349f39b4bc3688448bb6e \
            node --test \
              scripts/payment-v1-caddy-admin-uds-gate.test.mjs \
              scripts/payment-v1-caddy-admin-uds-transaction.fs.test.mjs \
              scripts/payment-v1-caddy-admin-uds-transaction.test.mjs
          sh -n scripts/payment-v1-caddy-admin-uds-process.test.sh
          scripts/payment-v1-caddy-admin-uds-process.test.sh
          sh -n scripts/payment-v1-caddy-admin-uds-systemd.test.sh
          scripts/payment-v1-caddy-admin-uds-systemd.test.sh
      - name: Typecheck the opt-in CDK browser interoperability harness
        working-directory: web
        run: npx --no-install tsc -p tsconfig.payment-cdk-cashu-e2e.json --pretty false
      - name: Exercise bounded Nostr relay readback inputs
        run: |
          node --check scripts/payment-v1-nostr-readback.mjs
          node --test scripts/payment-v1-nostr-readback.test.mjs
          node scripts/payment-v1-nostr-readback.mjs --help >/dev/null
      - name: Install Chromium test runtime
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium
      - name: Generate current pir-sdk-wasm browser package
        run: >-
          CARGO_NET_OFFLINE=true wasm-pack build crates/sdk/wasm
          --target web --out-dir pkg --mode no-install --no-opt
          -- --locked --offline
      - name: Exercise local multi-tab vault and claim recovery
        working-directory: web
        run: npm run test:e2e:payment-vault
      - name: Exercise real WASM against the loopback no-funds issuer
        working-directory: web
        run: npm run test:e2e:payment-real-issuer
      - name: Exercise browser issuance and verified DPF query across two providers
        working-directory: web
        run: npm run test:e2e:payment-two-provider
      - name: Upload browser boundary failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: payment-vault-browser-${{ github.run_id }}
          path: |
            web/test-results/payment-vault/
            web/test-results/payment-real-issuer/
            web/test-results/payment-two-provider/
          if-no-files-found: ignore
          retention-days: 14
