name: Deploy Web Client to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: 'Deploy the verified artifact to the production GitHub Pages environment'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.18.0'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup target add wasm32-unknown-unknown

      - name: Cache Cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-web-deploy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-web-deploy-

      - name: Install pinned WASM tools without executing a remote installer
        run: |
          cd "$RUNNER_TEMP"
          cargo +1.94.1 install wasm-pack \
            --version 0.14.0 \
            --locked \
            --root "$RUNNER_TEMP/wasm-pack"
          cargo +1.94.1 install wasm-bindgen-cli \
            --version 0.2.114 \
            --locked \
            --root "$RUNNER_TEMP/wasm-pack"
          echo "$RUNNER_TEMP/wasm-pack/bin" >> "$GITHUB_PATH"

      - name: Build pir-sdk-wasm
        run: >-
          CARGO_NET_OFFLINE=true wasm-pack build crates/sdk/wasm
          --target web --out-dir pkg --mode no-install --no-opt
          -- --locked --offline

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Enforce manual main-only production Pages deployment
        run: node scripts/payment-v1-pages-deploy-gate.mjs

      - name: TypeScript strict typecheck
        working-directory: web
        run: npm run build

      - name: Run unit tests before publishing
        working-directory: web
        run: npm test

      - name: Install Chromium test runtime
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium

      - name: Exercise local multi-tab payment vault before publishing
        working-directory: web
        run: npm run test:e2e:payment-vault

      - name: Exercise real WASM against loopback no-funds issuer before publishing
        working-directory: web
        run: npm run test:e2e:payment-real-issuer

      - name: Exercise browser issuance and verified DPF query across two providers before publishing
        working-directory: web
        run: npm run test:e2e:payment-two-provider

      - name: Build production bundle
        working-directory: web
        run: npm run build-web

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web/dist-web

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_production_deploy }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
