name: PIR SDK Integration Tests

# Pull requests and main pushes build the SDK and run its unit tests. The
# `#[ignore]`d tests against the public deployment (the servers the web
# client at https://www.bitcoinpir.org uses) run on the daily schedule or a
# manual dispatch, so server availability never fails a PR. They run with
# --test-threads=1 so one runner IP doesn't trip the servers' handshake
# rate limits.

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/sdk/core/**'
      - 'crates/sdk/client/**'
      - 'crates/protocol/**'
      - 'crates/trust/**'
      - 'apps/server/Cargo.toml'
      - 'apps/server/src/hint_pool.rs'
      - 'apps/server/src/bin/unified_server/**'
      - '.github/workflows/pir-sdk-integration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/sdk/core/**'
      - 'crates/sdk/client/**'
      - 'crates/protocol/**'
      - 'crates/trust/**'
      - 'apps/server/Cargo.toml'
      - 'apps/server/src/hint_pool.rs'
      - 'apps/server/src/bin/unified_server/**'
      - '.github/workflows/pir-sdk-integration.yml'
  workflow_dispatch:
  # Daily, 06:17 UTC (off-peak for the servers).
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  integration:
    name: pir-sdk-client integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      # Operator API key (docs/CREDITS.md "API keys"), presented on every leg
      # once the secure channel is open, so paid backends serve the suite.
      PIR_API_KEY: ${{ secrets.PIR_API_KEY }}
      PIR_DPF_SERVER0_URL: wss://weikeng1.bitcoinpir.org
      PIR_DPF_SERVER1_URL: wss://bitcoin-pir-weikeng-laptop.chenweikeng.com
      # pir1 serves HarmonyPIR hints, pir2 (the MacBook node) queries.
      PIR_HARMONY_HINT_URL: wss://weikeng1.bitcoinpir.org
      PIR_HARMONY_QUERY_URL: wss://bitcoin-pir-weikeng-laptop.chenweikeng.com

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Cache Cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-sdk-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sdk-

      - name: Build pir-sdk-client (library + tests)
        run: cargo build -p pir-sdk-client --tests

      - name: Run unit tests
        run: cargo test -p pir-sdk-client

      - name: Run ignored integration tests against live PIR servers (scheduled/manual only)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: cargo test -p pir-sdk-client --test integration_test -- --ignored --test-threads=1 --nocapture

  integration-onion:
    # The `onion` feature builds libonionpir from source (CMake + GCC), a
    # slow compile, so it has its own job and cache.
    name: pir-sdk-client OnionPIR integration tests
    # GCC 11: Intel HEXL's AVX512 auto-detection fails to build under GCC 13
    # ("inlining failed in call to always_inline ... target specific option
    # mismatch") whenever the cache is cold.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      PIR_API_KEY: ${{ secrets.PIR_API_KEY }}
      PIR_ONION_URL: wss://weikeng1.bitcoinpir.org

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Cache Cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-sdk-onion-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sdk-onion-

      - name: Build pir-sdk-client with --features onion (library + tests)
        run: cargo build -p pir-sdk-client --features onion --tests

      - name: Run unit tests with --features onion
        run: cargo test -p pir-sdk-client --features onion

      # Reuses this job's OnionPIR build: the runtime depends on OnionPIR even
      # though these tests exercise only HarmonyPIR.
      - name: Run HarmonyPIR hint-pool and server backend tests
        run: |
          cargo test -p runtime --lib hint_pool
          cargo test -p runtime --no-default-features --lib hint_pool
          cargo test -p runtime --bin unified_server harmony_dos_guard_tests
          cargo test -p runtime --no-default-features --bin unified_server harmony_dos_guard_tests

      - name: Run ignored OnionPIR integration tests against live PIR servers (scheduled/manual only)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        # Quoted to keep YAML from parsing `::` as a mapping.
        run: "cargo test -p pir-sdk-client --features onion --test integration_test -- --ignored --test-threads=1 --nocapture onion_tests::"

  leakage-canary:
    # Many live WebSocket connections: runs after both integration jobs, on
    # schedule or dispatch only, every invariant serialized in this job.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: [integration, integration-onion]
    name: privacy leakage canary (DPF, HarmonyPIR, OnionPIR)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      PIR_API_KEY: ${{ secrets.PIR_API_KEY }}
      PIR_DPF_SERVER0_URL: wss://weikeng1.bitcoinpir.org
      PIR_DPF_SERVER1_URL: wss://bitcoin-pir-weikeng-laptop.chenweikeng.com
      PIR_HARMONY_HINT_URL: wss://weikeng1.bitcoinpir.org
      PIR_HARMONY_QUERY_URL: wss://bitcoin-pir-weikeng-laptop.chenweikeng.com
      PIR_ONION_URL: wss://weikeng1.bitcoinpir.org

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Cache Cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-sdk-leakage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sdk-leakage-
            ${{ runner.os }}-cargo-sdk-onion-

      - name: Run DPF leakage invariants
        run: |
          for test_name in \
            dpf_per_message_invariants_not_found \
            dpf_simulator_property_two_not_found \
            dpf_found_vs_not_found_have_byte_identical_profiles
          do
            cargo test -p pir-sdk-client --test leakage_integration_test \
              --release "$test_name" -- \
              --ignored --exact --test-threads=1 --nocapture
          done

      - name: Run HarmonyPIR leakage invariants (one retry)
        continue-on-error: true
        run: |
          run_harmony_invariants() {
            for test_name in \
              harmony_per_message_invariants_not_found \
              harmony_simulator_property_two_not_found \
              harmony_found_vs_not_found_have_byte_identical_profiles
            do
              cargo test -p pir-sdk-client --test leakage_integration_test \
                --release "$test_name" -- \
                --ignored --exact --test-threads=1 --nocapture || return 1
            done
          }
          run_harmony_invariants || run_harmony_invariants

      - name: Run OnionPIR leakage invariants
        continue-on-error: true
        run: |
          for test_name in \
            onion_per_message_invariants_not_found \
            onion_simulator_property_two_not_found \
            onion_found_vs_not_found_have_byte_identical_profiles
          do
            cargo test -p pir-sdk-client --features onion \
              --test leakage_integration_test --release "$test_name" -- \
              --ignored --exact --test-threads=1 --nocapture
          done
