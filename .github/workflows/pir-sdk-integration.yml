name: PIR SDK Integration Tests

# Runs the `pir-sdk-client` integration suite against the public PIR
# deployment (wss://weikeng1.bitcoinpir.org / wss://weikeng2.bitcoinpir.org).
# These are the same servers the web client at
# https://www.bitcoinpir.org uses, so a failure here would
# typically also break the web client — the workflow is our early-warning
# signal for SDK vs. production-server protocol drift.
#
# The tests are marked `#[ignore]` in the test binary and must be opted
# into with `-- --ignored`. Running them sequentially (`--test-threads=1`)
# keeps TLS handshakes from stepping on each other and keeps the fresh-sync
# chunk-batch traffic under the Cloudflare connection limit.
#
# Required vs live split (2026-08): pull requests and main pushes compile the
# SDK and run its deterministic unit tests. Tests that depend on the public
# deployment run only on the daily canary or an explicit workflow dispatch.
# Production availability and admission offers can change independently of a
# client patch (the current VPSBG beta offers Free-PoW for Direct ORAM, not
# DPF), so they must not make an otherwise deterministic PR check fail.
# Scheduled/manual live failures remain visible as canary failures.

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/sdk/core/**'
      - 'crates/sdk/client/**'
      - 'crates/protocol/**'
      - 'crates/trust/**'
      - 'apps/server/Cargo.toml'
      - 'apps/server/src/hint_pool.rs'
      - 'apps/server/src/bin/unified_server.rs'
      - '.github/workflows/pir-sdk-integration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/sdk/core/**'
      - 'crates/sdk/client/**'
      - 'crates/protocol/**'
      - 'crates/trust/**'
      - 'apps/server/Cargo.toml'
      - 'apps/server/src/hint_pool.rs'
      - 'apps/server/src/bin/unified_server.rs'
      - '.github/workflows/pir-sdk-integration.yml'
  workflow_dispatch:
  # Daily canary — catches breakage from server-side protocol changes
  # even when no SDK PRs land. 06:17 UTC = off-peak for the servers.
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  integration:
    name: pir-sdk-client integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      # Pin the default URLs explicitly so the CI log shows what we
      # tested against. Override via repository variables or a fork's
      # env block to hit a different deployment.
      PIR_DPF_SERVER0_URL: wss://weikeng1.bitcoinpir.org
      PIR_DPF_SERVER1_URL: wss://weikeng2.bitcoinpir.org
      # Production topology (per CLAUDE.md /
      # project_pir1_hint_pir2_query_split.md):
      #   pir1 = Hetzner, no-SEV   → HINT server  (--serve-hints + --pool-size)
      #   pir2 = VPSBG,   SEV-SNP  → QUERY server (--serve-queries)
      # The HINT_URL and QUERY_URL env vars were reversed in this
      # workflow before 2026-05-13 — fixed here so the CI
      # integration tests hit the correct role on each endpoint.
      PIR_HARMONY_HINT_URL: wss://weikeng1.bitcoinpir.org
      PIR_HARMONY_QUERY_URL: wss://weikeng2.bitcoinpir.org

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Cache Cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-sdk-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sdk-

      - name: Build pir-sdk-client (library + tests)
        run: cargo build -p pir-sdk-client --tests

      # --test-threads=1 serializes connections. The live servers are
      # fine under parallel load from real clients, but a burst of
      # simultaneous handshakes from a single runner IP can briefly
      # trip rate limits and surface as "Handshake not finished" errors.
      #
      # Public-deployment coverage is deliberately separate from the required
      # PR/main path. It is still exercised by the scheduled/manual canary,
      # where a production policy or availability change is useful signal.
      - name: Run unit tests
        run: cargo test -p pir-sdk-client
      - name: Run ignored integration tests against live PIR servers (scheduled/manual only)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: cargo test -p pir-sdk-client --test integration_test -- --ignored --test-threads=1 --nocapture

      # Strict scheduled signal for the currently supported product boundary:
      # verify and preflight both pinned roots, then complete Payment-V1
      # admission and a real db0 query. DPF/Harmony db1 backend queries are not
      # attempted because the signed production policies expose no db1 scope.
      - name: Run native database-root canary (DPF + HarmonyPIR)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          PIR_STRICT_PRODUCTION_CANARY: "1"
        run: cargo test -p pir-sdk-client --features fastprp --test integration_test strict_production_canary -- --ignored --test-threads=1 --nocapture

  integration-onion:
    # OnionPIR tests live in their own job because the `onion` feature
    # pulls in the `onionpir` crate, which builds SEAL + libonionpir from
    # source via CMake + GCC — a slow, ~5–10 minute compile. Running it
    # separately keeps the DPF/Harmony smoke tests fast on PRs while still
    # giving us end-to-end OnionPIR coverage.
    name: pir-sdk-client OnionPIR integration tests
    # Pinned to ubuntu-22.04 (GCC 11) instead of ubuntu-latest (GCC 13).
    # Intel HEXL's CMake auto-detects AVX512 from /proc/cpuinfo on the
    # runner host and enables AVX512 codegen, but on GCC 13 the per-
    # translation-unit target-attribute scoping is inconsistent — non-
    # AVX512 .cpp files include AVX512-flagged headers marked
    # `always_inline`, and GCC 13 errors out with
    #   "inlining failed in call to 'always_inline' '__m512i
    #    _mm512_add_epi64(...)': target specific option mismatch"
    # This fires any time the Cargo cache is cold (e.g. after a
    # Cargo.lock hash shift) and HEXL rebuilds from scratch. GCC 11 on
    # ubuntu-22.04 doesn't hit this. The upstream onionpir build.rs
    # hardcodes -DUSE_HEXL=ON on Linux x86_64 with no env-var escape
    # and explicitly wipes CXXFLAGS, so workflow-level flag injection
    # doesn't help. Revisit once the fork exposes a
    # ONIONPIR_DISABLE_HEXL env var (tracked separately).
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      PIR_ONION_URL: wss://weikeng1.bitcoinpir.org
      # The SEAL submodule is declared with an SSH URL
      # (git@github.com:…) in the `OnionPIRv2-fork` repo. Cargo's
      # libgit2-based fetcher won't authenticate as us on GitHub, so
      # force Cargo to shell out to the git CLI, which then honors the
      # `insteadOf` rewrite we install below.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Verify preinstalled C++ toolchain
        # The pinned ubuntu-22.04 image supplies GCC 11, CMake and libgomp.
        # Fail fast if that image contract changes instead of making every
        # run depend on the Ubuntu package mirrors before testing repo code.
        run: |
          command -v gcc
          command -v g++
          command -v cmake
          command -v make
          ldconfig -p | grep -F 'libgomp.so.1'
          test "$(gcc -dumpversion | cut -d. -f1)" = "11"
          test "$(g++ -dumpversion | cut -d. -f1)" = "11"
          gcc --version
          g++ --version
          cmake --version

      - name: Rewrite SSH GitHub URLs to HTTPS (for SEAL submodule)
        # The `onionpir` crate we depend on has a SEAL submodule whose
        # URL is `git@github.com:Bitcoin-PIR/SEAL-For-OnionPIR-fork.git`.
        # CI runners don't have SSH access to GitHub, so rewrite all
        # `git@github.com:` URLs to `https://github.com/` before Cargo
        # does its recursive submodule update.
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Cache Cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Separate cache key from the main integration job — the
          # `onion` feature produces a completely different target
          # directory (libonionpir.a, libseal-4.1.a, C++ object files).
          key: ${{ runner.os }}-cargo-sdk-onion-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sdk-onion-

      - name: Build pir-sdk-client with --features onion (library + tests)
        run: cargo build -p pir-sdk-client --features onion --tests

      - name: Run unit tests with --features onion
        run: cargo test -p pir-sdk-client --features onion

      # Reuse this GCC 11 job's already-built OnionPIR dependency for the
      # unified-server hint-pool checks. The runtime depends on OnionPIR even
      # though these focused tests exercise only HarmonyPIR persistence.
      - name: Run HarmonyPIR hint-pool and server backend tests
        run: |
          cargo test -p runtime --lib hint_pool
          cargo test -p runtime --no-default-features --lib hint_pool
          cargo test -p runtime --bin unified_server harmony_dos_guard_tests
          cargo test -p runtime --no-default-features --bin unified_server harmony_dos_guard_tests

      - name: Run ignored OnionPIR integration tests against live PIR servers (scheduled/manual only)
        # Same policy as the DPF/Harmony live step in the `integration` job
        # (see the header comment): PRs and main run only deterministic
        # tests; live-production coverage belongs to the scheduled/manual
        # canary so production availability changes cannot fail a PR.
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        # The `onion_tests` filter scopes this to the OnionPIR module
        # introduced in integration_test.rs — the DPF / Harmony tests
        # already ran in the `integration` job without the feature.
        # (Quoted to keep YAML from parsing `::` as a mapping.)
        run: "cargo test -p pir-sdk-client --features onion --test integration_test -- --ignored --test-threads=1 --nocapture onion_tests::"

      - name: Run native database-root canary (OnionPIR)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        # Same supported boundary as the DPF/Harmony canary: both roots are
        # verified/preflighted, while admission and the real query use db0.
        env:
          PIR_STRICT_PRODUCTION_CANARY: "1"
        run: "cargo test -p pir-sdk-client --features onion,fastprp --test integration_test onion_tests::test_onion_strict_production_canary -- --ignored --test-threads=1 --nocapture"

  leakage-canary:
    # The leakage suite opens many live WebSocket connections. Run it only
    # after both ordinary integration jobs succeed on scheduled/manual runs,
    # with every selected invariant serialized in this one job.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: [integration, integration-onion]
    name: privacy leakage canary (DPF, HarmonyPIR, OnionPIR)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      PIR_DPF_SERVER0_URL: wss://weikeng1.bitcoinpir.org
      PIR_DPF_SERVER1_URL: wss://weikeng2.bitcoinpir.org
      PIR_HARMONY_HINT_URL: wss://weikeng1.bitcoinpir.org
      PIR_HARMONY_QUERY_URL: wss://weikeng2.bitcoinpir.org
      PIR_ONION_URL: wss://weikeng1.bitcoinpir.org
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Verify preinstalled C++ toolchain
        # Keep the scheduled leakage job on the same network-free toolchain
        # preflight as the deterministic OnionPIR integration job above.
        run: |
          command -v gcc
          command -v g++
          command -v cmake
          command -v make
          ldconfig -p | grep -F 'libgomp.so.1'
          test "$(gcc -dumpversion | cut -d. -f1)" = "11"
          test "$(g++ -dumpversion | cut -d. -f1)" = "11"
          gcc --version
          g++ --version
          cmake --version

      - name: Rewrite SSH GitHub URLs to HTTPS (for SEAL submodule)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Cache Cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-sdk-leakage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sdk-leakage-
            ${{ runner.os }}-cargo-sdk-onion-

      - name: Run DPF leakage invariants
        run: |
          for test_name in \
            dpf_per_message_invariants_not_found \
            dpf_simulator_property_two_not_found \
            dpf_found_vs_not_found_have_byte_identical_profiles
          do
            cargo test -p pir-sdk-client --test leakage_integration_test \
              --release "$test_name" -- \
              --ignored --exact --test-threads=1 --nocapture
          done

      - name: Run HarmonyPIR leakage invariants (one retry)
        # Advisory privacy-regression signal. It is deliberately not a release
        # gate because it opens several production sessions and is broader than
        # the user-facing db0 health canary above.
        continue-on-error: true
        run: |
          run_harmony_invariants() {
            for test_name in \
              harmony_per_message_invariants_not_found \
              harmony_simulator_property_two_not_found \
              harmony_found_vs_not_found_have_byte_identical_profiles
            do
              cargo test -p pir-sdk-client --test leakage_integration_test \
                --release "$test_name" -- \
                --ignored --exact --test-threads=1 --nocapture || return 1
            done
          }
          run_harmony_invariants || run_harmony_invariants

      - name: Run OnionPIR leakage invariants
        # Advisory for the same reason as Harmony: useful privacy drift signal,
        # not an additional production release gate.
        continue-on-error: true
        run: |
          for test_name in \
            onion_per_message_invariants_not_found \
            onion_simulator_property_two_not_found \
            onion_found_vs_not_found_have_byte_identical_profiles
          do
            cargo test -p pir-sdk-client --features onion \
              --test leakage_integration_test --release "$test_name" -- \
              --ignored --exact --test-threads=1 --nocapture
          done
