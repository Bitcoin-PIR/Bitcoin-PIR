# Enable AES-NI and adjacent SSE/PCLMUL features on x86_64 so that intrinsic
# calls in dependencies like alf-nt (used by HarmonyPIR's PRP backend) inline
# the AES round instructions instead of going through one out-of-line
# function call per `_mm_aesenc_si128`. Without this, ALF's `Ktm::tweak_init`
# generates 48 `call _mm_aesenc_si128` sites in the release binary because
# the dep's own `.cargo/config.toml` is not propagated when it is consumed
# as a git dependency.
#
# Target gate is `cfg(target_arch = "x86_64")` so wasm32 and aarch64 builds
# are unaffected (those backends have their own intrinsic paths).

[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-feature=+aes,+ssse3,+sse4.1,+pclmulqdq"]

# ─── Dependency sources ────────────────────────────────────────────────────
# crates.io dependencies come from the registry and fastprp, harmonypir and
# libdpf from their git revs: Cargo.lock pins each registry crate's version
# and SHA-256 and each git dependency's commit, and `--locked` keeps a build
# on exactly that set.
#
# onionpir alone still builds from ./vendor/onionpir, which carries engine
# changes (the shared-store batch path of #466) that rev 3f815ba does not
# have. Re-running `cargo vendor` for it drops them.

[source."git+https://github.com/Bitcoin-PIR/OnionPIRv2-fork.git?rev=3f815ba86bc8cb2db5d892a006c1ee7fcbaf7e4b"]
git = "https://github.com/Bitcoin-PIR/OnionPIRv2-fork.git"
rev = "3f815ba86bc8cb2db5d892a006c1ee7fcbaf7e4b"
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"

# ─── Reproducible-build env ────────────────────────────────────────────────
# SOURCE_DATE_EPOCH=0 makes any timestamp-embedding build.rs scripts use
# 1970-01-01 instead of the current wall clock. force=true overrides any
# operator-set SDE so the value is consistent regardless of shell
# environment.
#
# --remap-path-prefix is NOT in this file — it depends on $PWD/$HOME at
# build time and TOML can't interpolate; pass it through RUSTFLAGS.

[env]
SOURCE_DATE_EPOCH = { value = "0", force = true }
