[package]
name = "build"
version = "0.1.0"
edition = "2021"
autobins = false

# Workspace-internal tooling crate (database build pipeline binaries).
# Not a library — not published to crates.io.
publish = false

# The bins have no #[test]s; `test = false` keeps `cargo test` from linking
# an empty test harness for each one.

# ─── Essential pipeline (required for server/client) ─────────────────────────
# Order: scripts/build_full.sh

[[bin]]
name = "gen_0_extract_utxo_set"
path = "src/gen_0_utxo_set.rs"
test = false

[[bin]]
name = "gen_1_build_utxo_chunks"
path = "src/build_utxo_chunks.rs"
test = false

[[bin]]
name = "gen_1_onion"
path = "src/gen_1_onion.rs"
test = false

[[bin]]
name = "gen_2_onion"
path = "src/gen_2_onion.rs"
test = false

[[bin]]
name = "gen_3_onion"
path = "src/gen_3_onion.rs"
test = false

# ─── Delta database pipeline ────────────────────────────────────────────────

[[bin]]
name = "delta_gen_0"
path = "src/delta_gen_0_compute_delta.rs"
test = false

[[bin]]
name = "delta_gen_1"
path = "src/delta_gen_1_build_chunks.rs"
test = false

[[bin]]
name = "delta_gen_1_onion"
path = "src/delta_gen_1_onion.rs"
test = false

[[bin]]
name = "build_cuckoo_generic"
path = "src/build_cuckoo_generic.rs"
test = false

[[bin]]
name = "gen_4_build_merkle_onion"
path = "src/gen_4_build_merkle_onion.rs"
test = false

[[bin]]
name = "gen_4_build_merkle_bucket"
path = "src/gen_4_build_merkle_bucket.rs"
test = false

[dependencies]
pir-core = { path = "../../crates/protocol/core" }
bitcoin = "0.32.7"
txoutset = "0.4"
memmap2 = "0.9"
rayon = "1.10"
libdpf = { git = "https://github.com/weikengchen/libdpf.git", rev = "8ceb5903ae38c6f16a5ee92c0706dd50f5a42110" }
onionpir = { git = "https://github.com/Bitcoin-PIR/OnionPIRv2-fork.git", rev = "3f815ba86bc8cb2db5d892a006c1ee7fcbaf7e4b" }
brk_reader = "0.2"
brk_rpc = "0.2"
