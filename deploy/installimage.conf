# Hetzner installimage config for BitcoinPIR host
# Target: 65.21.91.217 (Intel i7-8700, 125 GB RAM, 2x 954 GB NVMe)
# Generated for review before running installimage on the rescue system.

DRIVE1 /dev/nvme0n1
DRIVE2 /dev/nvme1n1

# Software RAID1 mirror across both NVMe drives (redundancy).
SWRAID 1
SWRAIDLEVEL 1

BOOTLOADER grub

HOSTNAME pir

# Partitions (numbers mirror across both drives).
# /boot kept small and on its own partition for grub/initramfs simplicity.
# 8 GB swap is generous given 125 GB RAM but cheap; used only under pressure.
# All remaining space goes to / as ext4.
PART /boot ext4      1024M
PART swap  swap      8G
PART /     ext4      all

IMAGE /root/images/Ubuntu-2404-noble-amd64-base.tar.gz
