[package]
name = "rollback-authority"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
publish = false
description = "Offline administration and loopback service for the BitcoinPIR remote rollback authority"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bitcoin-PIR/Bitcoin-PIR"

[[bin]]
name = "rollback-authority"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
getrandom = "0.2"
hex = "0.4"
httparse = "1"
pir-rollback-authority-protocol = { path = "../../crates/security/rollback-authority-protocol" }
pir-rollback-authority-store = { path = "../../crates/security/rollback-authority-store" }
pir-private-files = { path = "../../crates/security/private-files" }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
