[package]
name = "runtime"
version = "0.1.0"
edition = "2021"

# The PIR server (`unified_server`). Not published to crates.io.
publish = false

[[bin]]
name = "unified_server"
path = "src/bin/unified_server/main.rs"

[features]
default = ["fastprp"]
fastprp = ["harmonypir/fastprp-prp"]
# Per-query logging for local diagnostics: logs peer, request shape and
# timing. Never in a deployed binary.
test-only-unsafe-query-logging = []
# Direct ORAM (`--direct-oram-*`, `--oram-only`).
cuckoo-oram = ["dep:bitcoinpir-oram"]

[dependencies]
pir-core = { path = "../../crates/protocol/core" }
pir-runtime-core = { path = "../../crates/protocol/runtime" }
pir-db-attest = { path = "../../crates/trust/db-attest" }
pir-identity = { path = "../../crates/trust/identity" }
pir-credit = { path = "../../crates/trust/pir-credit" }
# Issuer client: HTTPS to the credit issuer over the TLS stack
# tokio-tungstenite already pins (no new crate enters the lockfile).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
ed25519-dalek = "2"
hex = "0.4"
zeroize = "1"
libc = "0.2"
libdpf = { git = "https://github.com/weikengchen/libdpf.git", rev = "8ceb5903ae38c6f16a5ee92c0706dd50f5a42110" }
onionpir = { git = "https://github.com/Bitcoin-PIR/OnionPIRv2-fork.git", rev = "3f815ba86bc8cb2db5d892a006c1ee7fcbaf7e4b" }
harmonypir = { git = "https://github.com/Bitcoin-PIR/harmonypir.git", rev = "97288656b9b8cc393de7a8bc4d30d769404c2f39", default-features = false }
memmap2 = "0.9"
rayon = "1.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bitcoinpir-oram = { path = "../../vendor/bitcoinpir-oram", optional = true }

[dev-dependencies]
tempfile = "3"
pir-sdk-client = { path = "../../crates/sdk/client" }
