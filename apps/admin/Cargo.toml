[package]
name = "bpir-admin"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
authors = ["Bitcoin PIR contributors"]
description = "Operator CLI for Bitcoin PIR servers"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "bpir-admin"
path = "src/main.rs"

[dependencies]
pir-core = { path = "../../crates/protocol/core" }
pir-sdk-client = { path = "../../crates/sdk/client" }
pir-identity = { path = "../../crates/trust/identity" }
pir-attest-verify = { path = "../../crates/trust/attest-verify" }
pir-db-attest = { path = "../../crates/trust/db-attest" }

clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
ed25519-dalek = "2"
getrandom = "0.2"
hex = "0.4"
zeroize = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
