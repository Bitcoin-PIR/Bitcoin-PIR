[package]
name = "bpir-admin"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
authors = ["Bitcoin PIR contributors"]
description = "Operator CLI for Bitcoin PIR servers: keygen, attest, DB upload"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "bpir-admin"
path = "src/main.rs"

[dependencies]
pir-core = { path = "../../crates/protocol/core" }
pir-sdk = { path = "../../crates/sdk/core" }
pir-sdk-client = { path = "../../crates/sdk/client" }
# Used by `generate-identity` + `sign-identity` subcommands to build
# IdentityCert blobs the server consumes.
pir-identity = { path = "../../crates/trust/identity" }
# Slice D: parse the SNP report locally so `bpir-admin show-vcek-url`
# can extract chip_id + TCB and print the AMD KDS curl commands.
pir-attest-verify = { path = "../../crates/trust/attest-verify" }
pir-db-attest = { path = "../../crates/trust/db-attest" }
pir-service-protocol = { path = "../../crates/protocol/service" }
pir-directory-nostr = { path = "../../crates/directory/nostr" }
pir-arc-adapter = { path = "../../crates/payment/arc-adapter" }
pir-cashu-client = { path = "../../crates/payment/cashu-client" }
pir-cashu-custody = { path = "../../crates/payment/cashu-custody" }
pir-payment-crypto = { path = "../../crates/payment/crypto" }
pir-service-store = { path = "../../crates/protocol/service-store" }
pir-strict-https = { path = "../../crates/net/strict-https" }
pir-private-files = { path = "../../crates/security/private-files" }
pir-runtime-core = { path = "../../crates/protocol/runtime" }

clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
ed25519-dalek = "2"
getrandom = "0.2"
rand_core = "0.6"
hex = "0.4"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rustix = { version = "1", features = ["fs", "net", "process"] }
zeroize = "1"
k256 = { version = "0.13", features = ["schnorr"] }
sha2 = "0.10"
async-trait = "0.1"
sev = { version = "7", default-features = false, features = ["snp", "crypto_nossl"] }
tempfile = "3"

[dev-dependencies]
rustix = { version = "1", features = ["thread"] }
