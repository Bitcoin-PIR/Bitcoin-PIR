[package]
name = "bpir-desktop"
version = "0.1.0"
edition = "2021"
build = "build.rs"
publish = false

[lib]
name = "bpir_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "bpir-desktop"
path = "main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
runtime = { path = "../../server" }
pir-sdk-client = { path = "../../../crates/sdk/client", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
hex = "0.4"
tempfile = "3"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio-tungstenite = { version = "0.24", default-features = false }
futures-util = "0.3"
