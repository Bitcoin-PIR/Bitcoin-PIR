[package]
name = "payment-issuer"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
publish = false
description = "Designated BitcoinPIR cashu/ARC credential issuer"

[[bin]]
name = "payment-issuer"
path = "src/main.rs"

[dependencies]
arc = { git = "https://github.com/Bitcoin-PIR/arc.git", rev = "de6c1709eee0faa32985d5a452be11904ee95de4" }
rand_core = { version = "0.6", features = ["getrandom"] }
k256 = { version = "0.13", features = ["arithmetic"] }
hex = "0.4"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
