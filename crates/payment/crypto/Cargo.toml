[package]
name = "pir-payment-crypto"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
authors = ["Bitcoin PIR contributors"]
description = "Reviewed cryptographic adapters for BitcoinPIR payment transcripts"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bitcoin-PIR/Bitcoin-PIR"

[features]
default = []
# Provider binaries need the concrete BAT verifier implementation for the
# durable provider-store admission trait. Browser/native wallet consumers use
# only the transport-free cryptography and must not pull SQLite into WASM.
provider-store = ["dep:pir-service-store"]

[dependencies]
k256 = { version = "0.13", default-features = false, features = ["schnorr"] }
pir-service-protocol = { path = "../../protocol/service" }
pir-service-store = { path = "../../protocol/service-store", optional = true }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# k256's Schnorr dependency graph enables rand_core's std feature even though
# this crate accepts caller-provided auxiliary randomness. Select Web Crypto's
# supported getrandom backend so the verifier/signing helper remains buildable
# inside the browser WASM package.
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
hex = "0.4"

[lints.rust]
unsafe_code = "forbid"
