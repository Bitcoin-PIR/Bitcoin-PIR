[package]
name = "pir-issuer-credentials"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
authors = ["Bitcoin PIR contributors"]
description = "Fail-closed direct-receipt and blind Cashu BAT issuance for BitcoinPIR"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bitcoin-PIR/Bitcoin-PIR"

[dependencies]
ed25519-dalek = "2"
hmac = "0.12"
pir-payment-crypto = { path = "../crypto" }
pir-arc-adapter = { path = "../arc-adapter" }
pir-service-protocol = { path = "../../protocol/service" }
rand_chacha = "0.3"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
arc = { git = "https://github.com/Bitcoin-PIR/arc.git", rev = "de6c1709eee0faa32985d5a452be11904ee95de4" }
pir-lightning-backend = { path = "../lightning-backend" }

[lints.rust]
unsafe_code = "forbid"
