[package]
name = "pir-arc-adapter"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
authors = ["Bitcoin PIR contributors"]
description = "Experimental draft-01 ARC cryptographic adapter for BitcoinPIR"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bitcoin-PIR/Bitcoin-PIR"
homepage = "https://github.com/Bitcoin-PIR/Bitcoin-PIR"
documentation = "https://docs.rs/pir-arc-adapter"
keywords = ["bitcoin", "privacy", "credentials", "arc"]
categories = ["cryptography"]

[features]
default = []
provider-store = ["dep:pir-service-store"]

[dependencies]
arc = { git = "https://github.com/Bitcoin-PIR/arc.git", rev = "de6c1709eee0faa32985d5a452be11904ee95de4" }
pir-service-protocol = { path = "../../protocol/service" }
pir-service-store = { path = "../../protocol/service-store", optional = true }
rand_core = "0.6"
sha2 = { version = "0.10", default-features = false }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The adapter accepts caller-provided RNGs, but ARC's rand_core feature graph
# still selects getrandom. Browser builds must route it through Web Crypto.
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
ed25519-dalek = "2"
hex = "0.4"
rand_chacha = "0.3"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
