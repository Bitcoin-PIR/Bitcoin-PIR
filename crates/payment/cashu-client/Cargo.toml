[package]
name = "pir-cashu-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
authors = ["Bitcoin PIR contributors"]
description = "Fail-closed standard Cashu merchant swap and recovery adapter for BitcoinPIR"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bitcoin-PIR/Bitcoin-PIR"
homepage = "https://github.com/Bitcoin-PIR/Bitcoin-PIR"
documentation = "https://docs.rs/pir-cashu-client"
keywords = ["bitcoin", "cashu", "ecash", "privacy"]
categories = ["cryptography", "database"]

[features]
default = []
# This store deliberately has no independent anti-rollback floor. It is useful
# for deterministic tests and local demos only and must never back production
# admission. Production integrations implement `CashuSwapStoreV1` with an
# independently durable, linearizable rollback authority.
insecure-dev-sqlite-store = ["dep:rusqlite"]

[dependencies]
pir-payment-crypto = { path = "../crypto" }
pir-service-protocol = { path = "../../protocol/service" }
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pir-service-store = { path = "../../protocol/service-store" }
pir-runtime-core = { path = "../../protocol/runtime" }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
getrandom = "0.2"
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
ed25519-dalek = "2"
hex = "0.4"
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
