[package]
name = "pir-provider-clearing-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
authors = ["Bitcoin PIR contributors"]
description = "Provider-side shared issuer redemption adapter for BitcoinPIR admission"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bitcoin-PIR/Bitcoin-PIR"

[features]
default = []
# Non-default debug/test-only private WebPKI root injection. The underlying
# strict HTTPS crate compile-errors if this feature reaches a release build.
test-only-webpki-root = ["pir-strict-https/test-only-webpki-root"]

[dependencies]
ed25519-dalek = "2"
getrandom = "0.2"
pir-runtime-core = { path = "../../protocol/runtime" }
pir-private-files = { path = "../../security/private-files" }
pir-rollback-authority-client = { path = "../../security/rollback-authority-client" }
pir-rollback-authority-protocol = { path = "../../security/rollback-authority-protocol" }
pir-service-protocol = { path = "../../protocol/service" }
pir-service-store = { path = "../../protocol/service-store" }
pir-strict-https = { path = "../../net/strict-https" }
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled"] }
sha2 = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
pir-issuer-clearing = { path = "../issuer-clearing" }
pir-issuer-service = { path = "../issuer-service" }
pir-issuer-store = { path = "../issuer-store" }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
