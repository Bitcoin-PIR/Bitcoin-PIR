[package]
name = "pir-lightning-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
authors = ["Bitcoin PIR contributors"]
description = "Fail-closed Lightning invoice backend boundary and fake node for BitcoinPIR"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bitcoin-PIR/Bitcoin-PIR"

[dependencies]
bitcoin = { version = "0.32", default-features = false, features = ["secp-recovery"] }
lightning-invoice = { version = "=0.34.0", default-features = false }
pir-service-protocol = { path = "../../protocol/service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
socket2 = "0.6"

[lints.rust]
unsafe_code = "forbid"
