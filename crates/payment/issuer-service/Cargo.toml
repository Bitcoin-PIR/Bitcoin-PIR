[package]
name = "pir-issuer-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
authors = ["Bitcoin PIR contributors"]
description = "Transport-neutral HTTP operation handlers for the BitcoinPIR payment issuer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bitcoin-PIR/Bitcoin-PIR"

[dependencies]
ed25519-dalek = "2"
pir-arc-adapter = { path = "../arc-adapter" }
pir-issuer-clearing = { path = "../issuer-clearing" }
pir-issuer-core = { path = "../issuer-core" }
pir-issuer-credentials = { path = "../issuer-credentials" }
pir-issuer-store = { path = "../issuer-store" }
pir-lightning-backend = { path = "../lightning-backend" }
pir-payment-crypto = { path = "../crypto" }
pir-service-protocol = { path = "../../protocol/service" }

[dev-dependencies]
getrandom = "0.2"
k256 = "0.13"
rand_chacha = "0.3"
tempfile = "3"
zeroize = "1"

[lints.rust]
unsafe_code = "forbid"
