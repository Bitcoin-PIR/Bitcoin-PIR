[package]
name = "pir-issuer-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
authors = ["Bitcoin PIR contributors"]
description = "Transport-neutral BOLT11 quote lifecycle orchestration for BitcoinPIR issuers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bitcoin-PIR/Bitcoin-PIR"

[dependencies]
ed25519-dalek = "2"
pir-issuer-store = { path = "../issuer-store" }
pir-lightning-backend = { path = "../lightning-backend" }
pir-service-protocol = { path = "../../protocol/service" }

[dev-dependencies]
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
