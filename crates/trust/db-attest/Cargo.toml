[package]
name = "pir-db-attest"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
authors = ["Bitcoin PIR contributors"]
description = "Verifier primitives for BitcoinPIR attested-builder database build evidence"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bitcoin-PIR/Bitcoin-PIR"
homepage = "https://github.com/Bitcoin-PIR/Bitcoin-PIR"
documentation = "https://docs.rs/pir-db-attest"
publish = false

[dependencies]
rootbundle = { git = "https://github.com/Bitcoin-PIR/attested-builder.git", rev = "80ad9b185760d2e36fd24baef50dd3030af8e94f" }
sha2 = { version = "0.10", default-features = false }
hex = "0.4"
thiserror = "1.0"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
