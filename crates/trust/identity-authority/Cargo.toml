[package]
name = "pir-identity-authority"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
description = "Owner-only append-only identity generation reservations for BitcoinPIR"

[dependencies]
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
hex = "0.4"
pir-identity = { path = "../identity" }
pir-private-files = { path = "../../security/private-files" }
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled"] }
sha2 = { version = "0.10", default-features = false }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
