[package]
name = "pir-identity"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
authors = ["Bitcoin PIR contributors"]
description = "Operator-signed server identity primitives for Bitcoin PIR: two-tier Ed25519 cert chain (operator IdentityCert → server-side ChannelManifest) used by the REQ_ANNOUNCE opcode to authenticate `server_static_pub`, which hosts without hardware attestation cannot otherwise prove."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bitcoin-PIR/Bitcoin-PIR"
homepage = "https://github.com/Bitcoin-PIR/Bitcoin-PIR"
documentation = "https://docs.rs/pir-identity"
readme = "README.md"
keywords = ["pir", "privacy", "ed25519", "attestation", "identity"]
categories = ["cryptography", "cryptography::cryptocurrencies"]

[dependencies]
# Ed25519 sign + verify. Same crate already pulled in by
# pir-runtime-core / pir-sdk-client / bpir-admin so no new git dep.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
