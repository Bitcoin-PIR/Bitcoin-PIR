[package]
name = "pir-strict-https"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[features]
default = []
# Test harnesses may add one private WebPKI trust anchor while retaining the
# normal hostname, validity, chain, signature, and mandatory SPKI-pin checks.
# Production binaries and workflows must never enable this feature.
test-only-webpki-root = []

[dependencies]
httparse = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = { version = "0.10", default-features = false }
webpki-roots = "0.26"
zeroize = "1"
