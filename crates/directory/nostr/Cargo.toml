[package]
name = "pir-directory-nostr"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
authors = ["Bitcoin PIR contributors"]
description = "Strict NIP-01/NIP-78 service-directory codec, operator assertions and rollback state machine for BitcoinPIR"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bitcoin-PIR/Bitcoin-PIR"
homepage = "https://github.com/Bitcoin-PIR/Bitcoin-PIR"
documentation = "https://docs.rs/pir-directory-nostr"
readme = "README.md"
keywords = ["bitcoin", "nostr", "directory", "privacy"]
categories = ["cryptography", "network-programming"]

[dependencies]
# Ed25519 for the inner operator assertion (same crate as pir-identity).
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# BIP340 Schnorr for the NIP-01 event signature of the directory publisher.
k256 = { version = "0.13", default-features = false, features = ["schnorr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
futures = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Independent secp256k1 Schnorr verification of the locked NIP-01 fixture.
bitcoin = { version = "0.32", default-features = false, features = ["secp-recovery"] }

[lints.rust]
unsafe_code = "forbid"
