[package]
name = "pir-directory-nostr"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
authors = ["Bitcoin PIR contributors"]
description = "Strict NIP-01/NIP-78 discovery codec and rollback state machine for BitcoinPIR"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bitcoin-PIR/Bitcoin-PIR"
homepage = "https://github.com/Bitcoin-PIR/Bitcoin-PIR"
documentation = "https://docs.rs/pir-directory-nostr"
keywords = ["bitcoin", "nostr", "directory", "privacy"]
categories = ["cryptography", "network-programming"]

[dependencies]
k256 = { version = "0.13", default-features = false, features = ["schnorr"] }
pir-service-protocol = { path = "../../protocol/service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
ed25519-dalek = "2"
futures = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bitcoin = { version = "0.32", default-features = false, features = ["secp-recovery"] }

[lints.rust]
unsafe_code = "forbid"
