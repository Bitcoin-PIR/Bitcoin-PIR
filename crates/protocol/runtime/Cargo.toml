[package]
name = "pir-runtime-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
build = "build.rs"
authors = ["Bitcoin PIR contributors"]
description = "Server-side runtime primitives for Bitcoin PIR: wire protocol, mmap'd database tables, DPF evaluation, and the request handler used by the unified_server binary"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bitcoin-PIR/Bitcoin-PIR"
homepage = "https://github.com/Bitcoin-PIR/Bitcoin-PIR"
documentation = "https://docs.rs/pir-runtime-core"
readme = "README.md"
keywords = ["pir", "privacy", "bitcoin", "cryptography", "server"]
categories = ["cryptography", "cryptography::cryptocurrencies", "network-programming::server"]

[dependencies]
pir-core = { version = "0.1.0", path = "../core" }
pir-channel = { version = "0.1.0", path = "../channel" }
# Two-tier operator-signed identity bundle returned by REQ_ANNOUNCE.
# Pure crypto (Ed25519 sign/verify + canonical wire encoding) — the
# server-side I/O wrapper (loading the identity key + cert from disk,
# building the per-boot ChannelManifest) lives in `crate::identity`.
pir-identity = { version = "0.1.0", path = "../../trust/identity" }
pir-private-files = { version = "0.1.0", path = "../../security/private-files" }
libdpf = { git = "https://github.com/weikengchen/libdpf.git", rev = "8ceb5903ae38c6f16a5ee92c0706dd50f5a42110" }
memmap2 = "0.9"
rayon = "1.10"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"
parking_lot = "0.12"
sha2 = "0.10"
hkdf = { version = "0.12", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
hex = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
# The typed guest firmware API keeps the message-version-1 derived-key ABI in
# one reviewed upstream definition. The runtime never relies on sev's default
# (currently message version 2).
sev = { version = "7", default-features = false, features = ["snp"] }

[dev-dependencies]
tempfile = "3"
