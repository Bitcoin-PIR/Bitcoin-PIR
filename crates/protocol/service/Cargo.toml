[package]
name = "pir-service-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
authors = ["Bitcoin PIR contributors"]
description = "Kept BitcoinPIR service identifiers and operation-start wire types"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bitcoin-PIR/Bitcoin-PIR"
homepage = "https://github.com/Bitcoin-PIR/Bitcoin-PIR"
documentation = "https://docs.rs/pir-service-protocol"
keywords = ["pir", "privacy", "protocol"]
categories = ["cryptography", "network-programming"]

[dependencies]
sha2 = { version = "0.10", default-features = false }
