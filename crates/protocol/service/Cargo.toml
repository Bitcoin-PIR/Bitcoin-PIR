[package]
name = "pir-service-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
authors = ["Bitcoin PIR contributors"]
description = "Canonical BitcoinPIR service-policy and authorization wire types"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bitcoin-PIR/Bitcoin-PIR"
homepage = "https://github.com/Bitcoin-PIR/Bitcoin-PIR"
documentation = "https://docs.rs/pir-service-protocol"
keywords = ["pir", "payments", "privacy", "protocol"]
categories = ["cryptography", "network-programming"]

[dependencies]
bech32 = { version = "0.11", default-features = false, features = ["alloc"] }
ed25519-dalek = "2"
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa"] }
sha2 = { version = "0.10", default-features = false }
zeroize = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
# Transitive signing/verification crates expose RNG-capable APIs even though
# this crate only verifies BOLT11/Ed25519 signatures in the browser.
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# The native parser uses rust-secp256k1. The browser build uses the pure-Rust
# verifier in `quote_wasm`, avoiding a target C toolchain and keeping both
# implementations covered by the same cross-parser vectors.
lightning-invoice = { version = "=0.34.0", default-features = false }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
bitcoin = { version = "0.32", default-features = false, features = ["secp-recovery"] }
