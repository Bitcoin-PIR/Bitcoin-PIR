[workspace]
resolver = "2"
members = [
    "crates/protocol/core",
    "crates/protocol/channel",
    "crates/trust/identity",
    "crates/trust/attest-verify",
    "crates/trust/db-attest",
    "crates/sdk/core",
    "crates/protocol/runtime",
    "crates/sdk/server",
    "crates/sdk/client",
    "crates/sdk/wasm",
    "bpir-admin",
    "build",
    "runtime",
    "block_reader",
    "dev-issuer",
]
exclude = ["electrum_plugin/harmonypir-python", "vendor/bitcoinpir-oram"]

[profile.release]
opt-level = 3
lto = "thin"
# codegen-units = 1 + incremental = false make the build deterministic at
# the cost of slower release compilations (sub-task 2 of
# docs/PHASE3_SLICE3_REPRO_PLAN.md). The unified_server binary baked into
# the Tier 3 UKI uses this profile, so its bytes — and therefore the
# resulting MEASUREMENT — must be reproducible across operators.
codegen-units = 1
incremental = false
panic = 'abort'

[profile.bench]
opt-level = 3
debug = false
rpath = false
lto = "thin"
incremental = true
debug-assertions = false

[profile.dev]
opt-level = 3
panic = 'abort'

[profile.test]
opt-level = 3
lto = "thin"
incremental = true
debug-assertions = true
debug = true
