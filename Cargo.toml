[workspace]
resolver = "2"
# One PIR service. Paid access is credits (crates/trust/pir-credit), verified
# at the issuer; the issuer itself lives in a separate repository. The
# Payment V1 crates, the ARC/Cashu verifiers, the payment-issuer app, and the
# v1 session grants were deleted in 2026-09.
members = [
    "crates/protocol/core",
    "crates/protocol/channel",
    "crates/security/private-files",
    "crates/trust/identity",
    "crates/trust/attest-verify",
    "crates/trust/db-attest",
    "crates/trust/pir-credit",
    "crates/directory/nostr",
    "crates/sdk/core",
    "crates/protocol/runtime",
    "crates/sdk/client",
    "crates/sdk/wasm",
    "apps/admin",
    "apps/directory-relay",
    "tools/db-builder",
    "apps/server",
]
exclude = ["vendor/bitcoinpir-oram"]

[profile.release]
opt-level = 3
lto = "thin"
# codegen-units = 1 + incremental = false make the build deterministic at
# the cost of slower release compilations (sub-task 2 of
# docs/history/PHASE3_SLICE3_REPRO_PLAN.md). The unified_server binary baked into
# the Tier 3 UKI uses this profile, so its bytes — and therefore the
# resulting MEASUREMENT — must be reproducible across operators.
codegen-units = 1
incremental = false
panic = 'abort'

[profile.bench]
opt-level = 3
debug = false
rpath = false
lto = "thin"
incremental = false
debug-assertions = false

# Local builds trade rebuild speed for disk. With debuginfo on, macOS keeps
# every linked binary's object files beside it for the debugger (unpacked
# split-debuginfo), and at opt-level 3 the incremental cache is about as big
# as the build itself. `cargo test` inherits this profile; there is no
# [profile.test], because its thin LTO made every rlib carry LLVM bitcode
# and every test binary run its own LTO link. panic = 'abort' is
# release-only: tests always unwind, so an aborting dev profile compiled
# every dependency twice (once for `cargo build`, once for `cargo test`).
# To debug: CARGO_PROFILE_DEV_DEBUG=true cargo test -p <crate> ...
[profile.dev]
opt-level = 3
debug = false
incremental = false
