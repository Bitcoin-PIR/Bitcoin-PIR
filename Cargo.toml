[workspace]
resolver = "2"
# One PIR service plus a single designated issuer (issue/verify cashu+ARC;
# collection is later work). The Payment V1 crates are deleted; unused
# support crates (strict-https, service-protocol, identity-authority,
# sdk/server) were removed in 2026-09.
members = [
    "crates/protocol/core",
    "crates/protocol/channel",
    "crates/security/private-files",
    "crates/trust/identity",
    "crates/trust/attest-verify",
    "crates/trust/db-attest",
    "crates/sdk/core",
    "crates/protocol/runtime",
    "crates/sdk/client",
    "crates/sdk/wasm",
    "apps/admin",
    "tools/db-builder",
    "apps/server",
    "tools/block-reader",
    "apps/payment-issuer",
]
exclude = ["vendor/bitcoinpir-oram"]

[profile.release]
opt-level = 3
lto = "thin"
# codegen-units = 1 + incremental = false make the build deterministic at
# the cost of slower release compilations (sub-task 2 of
# docs/history/PHASE3_SLICE3_REPRO_PLAN.md). The unified_server binary baked into
# the Tier 3 UKI uses this profile, so its bytes — and therefore the
# resulting MEASUREMENT — must be reproducible across operators.
codegen-units = 1
incremental = false
panic = 'abort'

[profile.bench]
opt-level = 3
debug = false
rpath = false
lto = "thin"
incremental = true
debug-assertions = false

[profile.dev]
opt-level = 3
panic = 'abort'

[profile.test]
opt-level = 3
lto = "thin"
incremental = true
debug-assertions = true
debug = true
