[workspace]
resolver = "2"
# Payment-layer split (D4, decided 2026-08-27): the system keeps one PIR
# service plus a single designated issuer (collect/issue/verify, no
# clearing party). Crates under crates/*/legacy/ are legacy-only — every
# consumer of them is itself slated for removal in the R series.
# KNOTTED (keep-side crates still depend on these; extraction surgery is
# scheduled before deletion): pir-service-store, pir-issuer-clearing.
members = [
    "crates/protocol/core",
    "crates/protocol/channel",
    "crates/protocol/service",
    "crates/protocol/service-store",
    "crates/payment/issuer-store",
    "crates/payment/crypto",
    "crates/payment/arc-adapter",
    "crates/payment/lightning-backend",
    "crates/payment/issuer-credentials",
    "crates/payment/issuer-clearing",
    "crates/payment/issuer-core",
    "crates/payment/issuer-service",
    "crates/security/private-files",
    "crates/net/strict-https",
    "crates/directory/nostr",
    "crates/trust/identity",
    "crates/trust/identity-authority",
    "crates/trust/attest-verify",
    "crates/trust/db-attest",
    "crates/sdk/core",
    "crates/protocol/runtime",
    "crates/sdk/server",
    "crates/sdk/client",
    "crates/sdk/wasm",
    "apps/admin",
    "tools/db-builder",
    "apps/server",
    "tools/block-reader",
    "apps/payment-issuer",
    "apps/cln-rpc-guard",
]
exclude = ["vendor/bitcoinpir-oram"]

[profile.release]
opt-level = 3
lto = "thin"
# codegen-units = 1 + incremental = false make the build deterministic at
# the cost of slower release compilations (sub-task 2 of
# docs/history/PHASE3_SLICE3_REPRO_PLAN.md). The unified_server binary baked into
# the Tier 3 UKI uses this profile, so its bytes — and therefore the
# resulting MEASUREMENT — must be reproducible across operators.
codegen-units = 1
incremental = false
panic = 'abort'

[profile.bench]
opt-level = 3
debug = false
rpath = false
lto = "thin"
incremental = true
debug-assertions = false

[profile.dev]
opt-level = 3
panic = 'abort'

[profile.test]
opt-level = 3
lto = "thin"
incremental = true
debug-assertions = true
debug = true
